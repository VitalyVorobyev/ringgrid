name: Security Audit

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        # Both ignored advisories are unmaintained notices, not vulnerabilities:
        # - paste is pulled by the latest radsym/nalgebra and image codec stack;
        # - ttf-parser is dev-only through the latest imageproc release.
        run: |
          cargo audit --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0192
          cargo audit --file crates/ringgrid-py/Cargo.lock --ignore RUSTSEC-2024-0436
          cargo audit --file crates/ringgrid-wasm/Cargo.lock --ignore RUSTSEC-2024-0436
          cargo audit --file crates/ringgrid-c/Cargo.lock --ignore RUSTSEC-2024-0436
