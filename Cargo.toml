[workspace]
resolver = "2"
members = [
    "crates/ringgrid",
    "crates/ringgrid-cli",
]
exclude = ["crates/ringgrid-py", "crates/ringgrid-wasm", "crates/ringgrid-c"]

[workspace.package]
version = "0.13.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/VitalyVorobyev/ringgrid"
homepage = "https://github.com/VitalyVorobyev/ringgrid"
rust-version = "1.91"

[workspace.dependencies]
nalgebra = { version = "0.35", features = ["serde-serialize"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp"] }
imageproc = { version = "0.27", default-features = false, features = ["rayon"] }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
approx = "0.5"
rand = "0.10"
tiny-solver = "0.18"
png = "0.18"
projective-grid = "0.14"
radsym = { version = "0.4.1", features = ["unsafe-opt"] }
web-time = "1"
