# Excluded from the root workspace, so `*.workspace = true` inheritance is
# unavailable here: these literals must be kept in sync with
# `[workspace.package]` / `[workspace.dependencies]` in the root Cargo.toml.
[package]
name = "ringgrid-py"
version = "0.13.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/VitalyVorobyev/ringgrid"
homepage = "https://github.com/VitalyVorobyev/ringgrid"
rust-version = "1.91"
description = "Python bindings for ringgrid"
publish = false

[lib]
name = "_ringgrid"
crate-type = ["cdylib"]

# Empty workspace table: this crate is excluded from the root workspace and
# builds standalone (it carries its own Cargo.lock). Declaring it explicitly
# lets cargo resolve it correctly even when the checkout is nested inside
# another workspace (e.g. a git worktree under the parent repo).
[workspace]

[dependencies]
ringgrid = { path = "../ringgrid", version = "0.13" }
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
