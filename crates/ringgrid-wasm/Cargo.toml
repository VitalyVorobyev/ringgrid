# Excluded from the ringgrid workspace and built standalone via wasm-pack.
# The empty `[workspace]` marks this crate as its own workspace root so cargo
# stops its upward search here (it otherwise walks past the repo root into any
# enclosing workspace, e.g. a git worktree nested under the main checkout).
[workspace]

# Excluded from the root workspace, so `*.workspace = true` inheritance is
# unavailable here: these literals must be kept in sync with
# `[workspace.package]` / `[workspace.dependencies]` in the root Cargo.toml.
[package]
name = "ringgrid-wasm"
version = "0.13.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/VitalyVorobyev/ringgrid"
homepage = "https://github.com/VitalyVorobyev/ringgrid"
rust-version = "1.91"
description = "WebAssembly bindings for ringgrid ring marker detector"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ringgrid = { path = "../ringgrid", version = "0.13", default-features = false }
# Only the pixel types are needed here; the codec set is chosen once in the
# workspace root and reaches this crate through `ringgrid`.
image = { version = "0.25", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
js-sys = "0.3"
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
# PNG decoder for the fixture the tests decode.
image = { version = "0.25", default-features = false, features = ["png"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
