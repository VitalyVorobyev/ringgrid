# Excluded from the ringgrid workspace and built standalone via wasm-pack.
# The empty `[workspace]` marks this crate as its own workspace root so cargo
# stops its upward search here (it otherwise walks past the repo root into any
# enclosing workspace, e.g. a git worktree nested under the main checkout).
[workspace]

[package]
name = "ringgrid-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "WebAssembly bindings for ringgrid ring marker detector"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ringgrid = { path = "../ringgrid", version = "0.11", default-features = false }
image.workspace = true
serde_json.workspace = true
serde.workspace = true
js-sys = "0.3"
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
image.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
